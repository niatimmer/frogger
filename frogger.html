<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Frogger</title>
    <link rel="icon" type="image/png" href="./favicon.png">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/auth.css">
  </head>
  <body>
    <div id="header-container">
      <h1 id="frogger-header">Frogger</h1>
      <img id="frogger-icon" src="favicon.png" alt="Frogger">
    </div>
    <button id="register-btn">REGISTER</button>
    <div id="input-container">
      <label id="login-text" for="name">Login</label>
      <input placeholder="Username" id="name-input" name="name" autocomplete="off" type="text">
      <span id="error-message">Username must be 3-20 chars!</span>
      <img id="start-btn" src="circle-play.svg" alt="Play Button to start game">
    </div>
    <div class="canvas-container" style="display: none;">
      <canvas
        width="600"
        height="800"
        style="background-color: #4f5152"
        id="froggerCanvas"
      ></canvas>
      <ol id="highscore-list"></ol>
    </div>
    <script type="module" src="./js/player.js"></script>
    <script type="module" src="./js/app.js"></script>
    <script type="module" src="./js/startGame.js"></script>
    <!-- <script type="module" src="./test.js"></script> -->
  </body>
</html>
